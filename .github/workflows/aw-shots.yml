name: aw-shots

# Temporary helper: photograph the deployed Activewear page from a runner.

on:
  push:
    paths:
      - ".github/workflows/aw-shots.yml"
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Photograph the live page
        run: node scripts/live-shots.mjs 2>&1 | tee relay/shots-log.txt
        continue-on-error: true

      - name: Publish
        if: always()
        run: |
          mkdir -p relay/shots
          ls -la relay/shots || true
          git config user.name "aw-shots"
          git config user.email "aw-shots@users.noreply.github.com"
          git add -f relay/shots relay/shots-log.txt
          git commit -m "chore(relay): screenshots of the deployed Activewear page" || true
          git push || true
