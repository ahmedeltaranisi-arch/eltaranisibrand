name: asset-relay

# Temporary helper: the development sandbox can only reach github.com, so this job
# pulls a client-provided Google Drive archive onto the branch where it can be read.

on:
  push:
    paths:
      - ".github/workflows/asset-relay.yml"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download the shared archive from Google Drive
        run: |
          set -eu
          ID=12MQOwJQoR9R01ARsgDFMaiJBjZf_89GF
          OUT=relay-brand-activewear.zip
          python3 -m pip install --quiet --disable-pip-version-check gdown || true
          if command -v gdown >/dev/null 2>&1; then
            gdown --fuzzy "https://drive.google.com/file/d/$ID/view" -O "$OUT" || true
          fi
          if [ ! -s "$OUT" ]; then
            curl -sSL -c /tmp/cookies -o "$OUT" "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
          fi
          if [ ! -s "$OUT" ]; then
            curl -sSL -c /tmp/cookies "https://drive.google.com/uc?export=download&id=$ID" -o /tmp/first.html
            TOKEN=$(grep -o 'confirm=[0-9A-Za-z_-]*' /tmp/first.html | head -1 || true)
            curl -sSL -b /tmp/cookies -o "$OUT" "https://drive.google.com/uc?export=download&id=$ID&${TOKEN:-confirm=t}"
          fi
          ls -l "$OUT"
          sha256sum "$OUT" | tee relay-sha256.txt
          (unzip -l "$OUT" || true) | head -80 | tee relay-contents.txt

      - name: Publish the archive on the branch
        run: |
          git config user.name "asset-relay"
          git config user.email "asset-relay@users.noreply.github.com"
          git add -f relay-brand-activewear.zip relay-sha256.txt relay-contents.txt
          git commit -m "chore(relay): bring the shared activewear archive onto the branch"
          git push
